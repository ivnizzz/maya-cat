<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мир кошечки Майя 🐾</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; box-sizing: border-box; user-select: none; position: relative; overflow: hidden;
            background: linear-gradient(180deg, #f5cd79 0%, #e17055 100%);
        }
        h1 { font-size: 34px; margin: 10px 0 2px 0; font-weight: 800; color: #ffffff; text-shadow: 0 3px 10px rgba(0,0,0,0.3); }
        
        /* 🏡 УЮТНЫЙ ДОМИК МАЙИ */
        .stage-wrapper {
            position: relative; width: 100%; max-width: 300px; height: 220px;
            background: #fff5eb; border-radius: 40px; margin-bottom: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            border: 6px solid #e17055; box-sizing: border-box;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .window {
            position: absolute; top: 15px; width: 45px; height: 45px;
            border: 3px solid #f1c40f; border-radius: 8px; background: #74b9ff;
        }

        /* 🐱 ЖИВАЯ АНИМАЦИЯ КОТИКА (ЭМОДЗИ) */
        .cat-display {
            font-size: 75px;
            margin-top: 35px;
            z-index: 5;
            transition: all 0.2s ease;
            animation: breathe 3s ease-in-out infinite;
            transform-origin: bottom center;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06) translateY(-2px); }
        }
        .jump-anim { animation: jump 0.4s ease-out !important; }
        @keyframes jump {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }

        /* ИНТЕРФЕЙС ШКАЛ */
        .stats-card { background: rgba(255, 255, 255, 0.95); border-radius: 24px; padding: 20px; width: 100%; max-width: 320px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); margin-bottom: 20px; box-sizing: border-box; }
        .stat-row { margin-bottom: 12px; }
        .stat-row:last-child { margin-bottom: 0; }
        .stat-label { font-size: 14px; font-weight: 700; margin-bottom: 5px; display: flex; justify-content: space-between; color: #4a5568; }
        .progress-bar { width: 100%; height: 14px; background-color: #edf2f7; border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #2ecc71, #26de81); border-radius: 10px; transition: width 0.4s ease; }
        #bar-sleep { background: linear-gradient(90deg, #3498db, #45aaf2); }
        #bar-mood { background: linear-gradient(90deg, #ff9f43, #f7b731); }
        
        /* КНОПКИ */
        .buttons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 320px; }
        button.action-btn { background: #ffffff; color: #4b7bec; border: none; padding: 14px; border-radius: 16px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); }
        button.action-btn:active { transform: scale(0.95); background: #4b7bec; color: #ffffff; }
        .reset-btn { background-color: #fff5f5 !important; color: #eb4d4b !important; grid-column: span 2; margin-top: 4px; }
    </style>
</head>
<body>

    <h1>Майя 🐾</h1>

    <div class="stage-wrapper">
        <div class="window"></div>
        <!-- Блок кошечки, куда скрипт будет подставлять живые эмодзи -->
        <div id="cat-avatar" class="cat-display">🐈‍⬛</div>
    </div>

    <div class="stats-card">
        <div class="stat-row">
            <div class="stat-label"><span>🐟 Сытость</span><span id="val-hunger">100%</span></div>
            <div class="progress-bar"><div id="bar-hunger" class="progress-fill"></div></div>
        </div>
        <div class="stat-row">
            <div class="stat-label"><span>💤 Энергия</span><span id="val-sleep">100%</span></div>
            <div class="progress-bar"><div id="bar-sleep" class="progress-fill"></div></div>
        </div>
        <div class="stat-row">
            <div class="stat-label"><span>🧸 Настроение</span><span id="val-mood">100%</span></div>
            <div class="progress-bar"><div id="bar-mood" class="progress-fill"></div></div>
        </div>
    </div>

    <div class="buttons-grid">
        <button class="action-btn" onclick="feedBtn()">🍼 Покормить</button>
        <button class="action-btn" onclick="sleepBtn()">🛌 В люлю</button>
        <button class="action-btn" onclick="playBtn()">⚽ Поиграть</button>
        <button class="action-btn reset-btn" onclick="resetPet()">🔄 Восстановить шкалы</button>
    </div>

    <script>
        // Полностью автономная и неубиваемая логика
        let petData = { hunger: 100, sleep: 100, mood: 100, lastTime: Date.now() };
        let isSleeping = false;

        function updateUI() {
            document.getElementById('bar-hunger').style.width = petData.hunger + '%';
            document.getElementById('val-hunger').innerText = Math.round(petData.hunger) + '%';
            document.getElementById('bar-sleep').style.width = petData.sleep + '%';
            document.getElementById('val-sleep').innerText = Math.round(petData.sleep) + '%';
            document.getElementById('bar-mood').style.width = petData.mood + '%';
            document.getElementById('val-mood').innerText = Math.round(petData.mood) + '%';

            const cat = document.getElementById('cat-avatar');
            if (!cat) return;

            // Живая смена состояний кошечки Майи через встроенные эмодзи
            if (petData.hunger <= 0 || petData.sleep <= 0 || petData.mood <= 0) {
                cat.innerText = "😿"; // Обиделась / ушла
            } else if (isSleeping) {
                cat.innerText = "😴"; // Спит (вместо букв летят зетки)
            } else if (petData.hunger < 40 || petData.mood < 40 || petData.sleep < 40) {
                cat.innerText = "🐱"; // Грустит, просит внимания
            } else {
                cat.innerText = "🐈‍⬛"; // Счастливая чёрная кошечка Майя!
            }
        }

        function calculateTime() {
            const now = Date.now();
            const elapsed = (now - petData.lastTime) / 1000;
            if (elapsed <= 0) return;

            if (isSleeping) {
                petData.sleep = Math.min(100, petData.sleep + (elapsed * (7 / 60)));
                petData.hunger = Math.max(0, petData.hunger - (elapsed * (0.4 / 60)));
                if (petData.sleep >= 100) isSleeping = false;
            } else {
                // Скорость падения: сытость и настроение тратятся за ~1.5 - 2 часа
                petData.hunger = Math.max(0, petData.hunger - (elapsed * (0.85 / 60)));
                petData.sleep = Math.max(0, petData.sleep - (elapsed * (0.65 / 60)));
                petData.mood = Math.max(0, petData.mood - (elapsed * (1.1 / 60)));
            }
            petData.lastTime = now;
            updateUI();
        }

        function triggerJump() {
            const cat = document.getElementById('cat-avatar');
            if(!cat) return;
            cat.classList.remove('jump-anim');
            void cat.offsetWidth;
            cat.classList.add('jump-anim');
        }

        function feedBtn() { calculateTime(); if(isSleeping) isSleeping = false; petData.hunger = Math.min(100, petData.hunger + 20); triggerJump(); updateUI(); save(); }
        function sleepBtn() { calculateTime(); isSleeping = true; petData.sleep = Math.min(100, petData.sleep + 30); updateUI(); save(); }
        function playBtn() { calculateTime(); if(isSleeping) isSleeping = false; petData.mood = Math.min(100, petData.mood + 25); triggerJump(); updateUI(); save(); }
        function resetPet() { isSleeping = false; petData = { hunger: 100, sleep: 100, mood: 100, lastTime: Date.now() }; updateUI(); save(); }

        setInterval(() => { calculateTime(); save(); }, 1000);
        function save() { localStorage.setItem('maya_ultra_data_v1', JSON.stringify(petData)); localStorage.setItem('maya_ultra_sleep_v1', JSON.stringify(isSleeping)); }
        function load() {
            const d = localStorage.getItem('maya_ultra_data_v1'); const s = localStorage.getItem('maya_ultra_sleep_v1');
            if(d) petData = JSON.parse(d); if(s) isSleeping = JSON.parse(s);
            petData.lastTime = Date.now(); calculateTime();
        }
        window.addEventListener('DOMContentLoaded', load);
    </script>
</body>
</html>
