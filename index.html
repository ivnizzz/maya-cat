<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мир кошечки Майя 🐾</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
            position: relative;
            overflow: hidden;
            transition: background 1.2s ease;
        }

        #effects-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        body.season-winter { background: linear-gradient(180deg, #3d3d5c 0%, #70a1ff 100%); }
        body.season-spring { background: linear-gradient(180deg, #78e08f 0%, #f5cd79 100%); }
        body.season-summer { background: linear-gradient(180deg, #2ae149 0%, #70a1ff 100%); }
        body.season-autumn { background: linear-gradient(180deg, #b33939 0%, #e17055 100%); }

        h1, #season-title, .game-container { position: relative; z-index: 10; }
        h1 { font-size: 32px; margin: 5px 0 2px 0; font-weight: 800; color: #ffffff; text-shadow: 0 3px 10px rgba(0,0,0,0.3); }
        #season-title { font-size: 13px; font-weight: 700; color: #ffffff; background: rgba(0, 0, 0, 0.3); padding: 5px 16px; border-radius: 20px; margin-bottom: 15px; }
        
        .game-container { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 340px; }

        .stage-wrapper {
            position: relative;
            width: 100%;
            height: 250px;
            margin-bottom: 20px;
            background: #74b9ff;
            border-radius: 36px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 6px solid #ffffff;
            box-sizing: border-box;
            z-index: 1;
            transition: background 1.2s ease;
        }

        .hill-back { position: absolute; bottom: 0; left: -20px; width: 120%; height: 100px; background: #20bf6b; border-radius: 50% 50% 0 0; transition: background 1.2s ease; }
        .hill-front { position: absolute; bottom: -10px; left: -40px; width: 130%; height: 80px; background: #26de81; border-radius: 60% 40% 0 0; z-index: 2; transition: background 1.2s ease; }
        .river { position: absolute; bottom: 0; left: 30%; width: 40px; height: 90px; background: #2980b9; transform: skewX(-25deg); z-index: 1; }
        .tree { position: absolute; bottom: 40px; right: 30px; width: 8px; height: 50px; background: #784c24; z-index: 3; }
        .tree-leaves { position: absolute; top: -30px; left: -21px; width: 50px; height: 50px; background: #218c74; border-radius: 50%; transition: background 1.2s ease; }

        .cozy-room {
            position: absolute;
            inset: 0;
            border: 12px solid #8c7ae6;
            border-radius: 30px;
            pointer-events: none;
            z-index: 5;
            box-sizing: border-box;
        }
        .house-plant { position: absolute; bottom: 15px; left: 20px; font-size: 24px; z-index: 6; }

        .cat-box {
            position: absolute;
            bottom: 5px; left: 50%;
            transform: translateX(-50%);
            width: 130px; height: 130px;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 10;
            pointer-events: auto;
        }
        
        .cat-svg-container {
            width: 100%; height: 100%;
            animation: breathe 4s ease-in-out infinite;
            transform-origin: bottom center;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.05) translateY(-3px); }
        }

        .jump-animation { animation: jumpEffect 0.4s ease-out !important; }
        @keyframes jumpEffect { 0%, 100% { transform: translateY(0); } 30% { transform: translateY(-35px); } }

        .floating-text { position: absolute; font-size: 22px; font-weight: 900; text-shadow: 0 2px 4px rgba(0,0,0,0.4); pointer-events: none; animation: floatUp 0.8s ease-out forwards; z-index: 100; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-60px); } }

        .stats-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 24px; padding: 20px; width: 100%; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); margin-bottom: 20px; box-sizing: border-box; }
        .stat-row { margin-bottom: 15px; }
        .stat-row:last-child { margin-bottom: 0; }
        .stat-label { font-size: 14px; font-weight: 700; margin-bottom: 6px; display: flex; justify-content: space-between; color: #4a5568; }
        .progress-bar { width: 100%; height: 16px; background-color: #edf2f7; border-radius: 12px; overflow: hidden; }
        .progress-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #2ecc71, #26de81); border-radius: 12px; transition: width 0.4s ease; }
        #bar-sleep { background: linear-gradient(90deg, #3498db, #45aaf2); }
        #bar-mood { background: linear-gradient(90deg, #ff9f43, #f7b731); }
        
        .buttons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
        button.action-btn { background: #ffffff; color: #4b7bec; border: none; padding: 16px; border-radius: 20px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 15px rgba(0, 0, 0, 0.05); }
        button.action-btn:active { transform: scale(0.94); background: #4b7bec; color: #ffffff; }
        .reset-btn { background-color: #fff5f5 !important; color: #eb4d4b !important; grid-column: span 2; margin-top: 4px; }
        
        .test-btn {
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid #ffffff;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 800;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="effects-canvas"></canvas>

    <div class="game-container">
        <h1>Майя 🐾</h1>
        <div id="season-title">Осень за окном 🍂</div>

        <div class="stage-wrapper" id="sky-bg">
            <div class="hill-back" id="h-back"></div>
            <div class="river"></div>
            <div class="hill-front" id="h-front"></div>
            <div class="tree"><div class="tree-leaves" id="t-leaves"></div></div>
            <div class="cozy-room"></div>
            <div class="house-plant" id="h-plant">🌵</div>
            
            <div class="cat-box" id="cat-holder" onclick="triggerCatJump()">
                <div class="cat-svg-container" id="cat-mesh"></div>
            </div>
        </div>

        <div class="stats-card">
            <div class="stat-row">
                <div class="stat-label"><span>🐟 Сытость</span><span id="val-hunger">100%</span></div>
                <div class="progress-bar"><div id="bar-hunger" class="progress-fill"></div></div>
            </div>
            <div class="stat-row">
                <div class="stat-label"><span>💤 Энергия</span><span id="val-sleep">100%</span></div>
                <div class="progress-bar"><div id="bar-sleep" class="progress-fill"></div></div>
            </div>
            <div class="stat-row">
                <div class="stat-label"><span>🧸 Настроение</span><span id="val-mood">100%</span></div>
                <div class="progress-bar"><div id="bar-mood" class="progress-fill"></div></div>
            </div>
        </div>

        <div class="buttons-grid">
            <button class="action-btn" onclick="feedBtn()">🍼 Покормить</button>
            <button class="action-btn" onclick="sleepBtn()">🛌 В люлю</button>
            <button class="action-btn" onclick="playBtn()">⚽ Поиграть</button>
            <button class="action-btn reset-btn" onclick="resetPet()">🔄 Восстановить шкалы</button>
        </div>

        <button class="test-btn" onclick="nextSeasonTest()">⚙️ ИЗМЕНИТЬ СЕЗОН (ТЕСТ)</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
